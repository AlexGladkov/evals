buildscript {
    ext.kotlin_version = '1.9.24' // 1.9.x: classic kapt handles mixed Java+Kotlin (K2 kapt duplicates Java stubs)
    repositories {
        google()
        mavenCentral() // JCenter удаляем
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.2' // Обновляем Gradle Plugin для Gradle 9.x
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'
        classpath 'androidx.benchmark:benchmark-gradle-plugin:1.3.3'
// Обновляем Google Services Plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
